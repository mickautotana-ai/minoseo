<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620">
<rect width="1200" height="620" rx="36" fill="#fff"/>
<text x="70" y="78" fill="#1F1416" font-family="Montserrat,Arial" font-size="30" font-weight="800">La structure réduit l'effort de lecture</text>
<text x="70" y="116" fill="#5E4F52" font-family="Montserrat,Arial" font-size="17">Une architecture claire aide le lecteur à trouver rapidement l'information.</text>
<g font-family="Montserrat,Arial" font-weight="800">
<rect x="120" y="170" width="960" height="75" rx="18" fill="#0E0A0B"/><text x="600" y="217" text-anchor="middle" fill="#fff" font-size="21">H1 — Promesse claire de la page</text>
<rect x="185" y="275" width="830" height="65" rx="16" fill="#FDE8EA"/><text x="600" y="316" text-anchor="middle" fill="#A81B2E" font-size="19">Introduction — réponse courte + contexte</text>
<rect x="250" y="370" width="700" height="58" rx="15" fill="#f7e0e4"/><text x="600" y="407" text-anchor="middle" fill="#A81B2E" font-size="18">H2 — Besoin / problème</text>
<rect x="315" y="455" width="570" height="58" rx="15" fill="#f2d2d7"/><text x="600" y="492" text-anchor="middle" fill="#A81B2E" font-size="18">H2 — Solution + preuves + action</text>
</g>
<text x="600" y="568" text-anchor="middle" fill="#5E4F52" font-family="Montserrat,Arial" font-size="15">Le balisage HTML doit refléter la logique éditoriale, pas seulement décorer la page.</text>
</svg>