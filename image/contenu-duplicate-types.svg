<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Comprendre les doublons d’URL</title><desc id="d">Trois URL différentes mènent à des contenus identiques ou similaires.</desc><rect width="1000" height="420" rx="28" fill="#fbf4f5"/><text x="500" y="54" text-anchor="middle" font-family="Montserrat,Arial" font-size="25" font-weight="700" fill="#241719">Un contenu, plusieurs adresses</text><g font-family="Montserrat,Arial"><rect x="70" y="105" width="250" height="76" rx="14" fill="#fff" stroke="#d7263d" stroke-width="2"/><text x="195" y="136" text-anchor="middle" font-size="15" fill="#a81b2e" font-weight="700">/produit</text><text x="195" y="158" text-anchor="middle" font-size="12" fill="#55494b">URL principale</text><rect x="375" y="105" width="250" height="76" rx="14" fill="#fff" stroke="#d8bfc3" stroke-width="2"/><text x="500" y="136" text-anchor="middle" font-size="15" fill="#55494b" font-weight="700">/produit?couleur=rouge</text><text x="500" y="158" text-anchor="middle" font-size="12" fill="#55494b">URL paramétrée</text><rect x="680" y="105" width="250" height="76" rx="14" fill="#fff" stroke="#d8bfc3" stroke-width="2"/><text x="805" y="136" text-anchor="middle" font-size="15" fill="#55494b" font-weight="700">/produit?tri=popular</text><text x="805" y="158" text-anchor="middle" font-size="12" fill="#55494b">Autre variante</text><path d="M195 181 V230 H500 M500 181 V230 M805 181 V230 H500 V258" fill="none" stroke="#d7263d" stroke-width="3" stroke-linecap="round"/><rect x="280" y="258" width="440" height="95" rx="18" fill="#0e0a0b"/><text x="500" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Choisir la bonne version</text><text x="500" y="320" text-anchor="middle" font-size="14" fill="#f4dfe2">Canonical, redirection ou contenu différencié</text></g></svg>