<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">La démarche de correction SEO</title><desc id="d">Quatre étapes : détecter, décider, corriger, vérifier.</desc><rect width="1000" height="360" rx="28" fill="#fbf4f5"/><text x="500" y="52" text-anchor="middle" font-family="Montserrat,Arial" font-size="25" font-weight="700" fill="#241719">Une correction efficace en quatre étapes</text><g font-family="Montserrat,Arial" text-anchor="middle"><g><rect x="45" y="110" width="205" height="155" rx="18" fill="#fff" stroke="#ead6d9"/><circle cx="147" cy="150" r="22" fill="#d7263d"/><text x="147" y="157" font-size="19" font-weight="700" fill="#fff">1</text><text x="147" y="198" font-size="17" font-weight="700" fill="#241719">Détecter</text><text x="147" y="223" font-size="12" fill="#65575a">Lister les URL</text></g><path d="M252 188 H278" stroke="#d7263d" stroke-width="3"/><path d="M270 180 L279 188 L270 196" fill="none" stroke="#d7263d" stroke-width="3"/><g><rect x="285" y="110" width="205" height="155" rx="18" fill="#fff" stroke="#ead6d9"/><circle cx="387" cy="150" r="22" fill="#d7263d"/><text x="387" y="157" font-size="19" font-weight="700" fill="#fff">2</text><text x="387" y="198" font-size="17" font-weight="700" fill="#241719">Décider</text><text x="387" y="223" font-size="12" fill="#65575a">Choisir la page cible</text></g><path d="M492 188 H518" stroke="#d7263d" stroke-width="3"/><path d="M510 180 L519 188 L510 196" fill="none" stroke="#d7263d" stroke-width="3"/><g><rect x="525" y="110" width="205" height="155" rx="18" fill="#fff" stroke="#ead6d9"/><circle cx="627" cy="150" r="22" fill="#d7263d"/><text x="627" y="157" font-size="19" font-weight="700" fill="#fff">3</text><text x="627" y="198" font-size="17" font-weight="700" fill="#241719">Corriger</text><text x="627" y="223" font-size="12" fill="#65575a">Canonical ou 301</text></g><path d="M732 188 H758" stroke="#d7263d" stroke-width="3"/><path d="M750 180 L759 188 L750 196" fill="none" stroke="#d7263d" stroke-width="3"/><g><rect x="765" y="110" width="190" height="155" rx="18" fill="#0e0a0b"/><circle cx="860" cy="150" r="22" fill="#d7263d"/><text x="860" y="157" font-size="19" font-weight="700" fill="#fff">4</text><text x="860" y="198" font-size="17" font-weight="700" fill="#fff">Vérifier</text><text x="860" y="223" font-size="12" fill="#f4dfe2">Contrôler l’indexation</text></g></g></svg>