<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Tableau de bord illustré SEO et GEO</title><desc id="d">Graphique montrant une progression indicative d’indicateurs SEO et GEO au fil des actions.</desc><rect width="1000" height="560" rx="32" fill="#FDE8EA"/><rect x="55" y="55" width="890" height="450" rx="24" fill="#fff" stroke="#F0D6D9"/><text x="90" y="105" font-family="Arial" font-size="25" font-weight="700" fill="#1F1416">Exemple de suivi des indicateurs</text><text x="90" y="135" font-family="Arial" font-size="15" fill="#5E4F52">Les indicateurs servent à piloter les priorités, pas à produire un simple reporting.</text><g stroke="#E9D8DB" stroke-width="1"><line x1="100" y1="430" x2="900" y2="430"/><line x1="100" y1="360" x2="900" y2="360"/><line x1="100" y1="290" x2="900" y2="290"/><line x1="100" y1="220" x2="900" y2="220"/><line x1="100" y1="150" x2="900" y2="150"/></g><polyline points="120,410 250,390 380,350 510,315 640,255 770,205 880,165" fill="none" stroke="#D7263D" stroke-width="6"/><polyline points="120,420 250,415 380,395 510,370 640,335 770,285 880,240" fill="none" stroke="#1F1416" stroke-width="5" stroke-dasharray="10 8"/><g fill="#D7263D"><circle cx="120" cy="410" r="7"/><circle cx="250" cy="390" r="7"/><circle cx="380" cy="350" r="7"/><circle cx="510" cy="315" r="7"/><circle cx="640" cy="255" r="7"/><circle cx="770" cy="205" r="7"/><circle cx="880" cy="165" r="7"/></g><g font-family="Arial" font-size="14" fill="#5E4F52"><text x="110" y="465">M1</text><text x="240" y="465">M2</text><text x="370" y="465">M3</text><text x="500" y="465">M4</text><text x="630" y="465">M5</text><text x="760" y="465">M6</text><text x="870" y="465">M7</text></g><rect x="660" y="80" width="15" height="15" rx="4" fill="#D7263D"/><text x="685" y="93" font-family="Arial" font-size="14" fill="#1F1416">Visibilité organique</text><rect x="810" y="80" width="15" height="15" rx="4" fill="#1F1416"/><text x="835" y="93" font-family="Arial" font-size="14" fill="#1F1416">Présence IA</text></svg>
