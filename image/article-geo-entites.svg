<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Les piliers de compréhension d'une marque par l'IA</title>
<desc id="desc">Infographie montrant quatre piliers : entité, expertise, cohérence et preuves.</desc>
<rect width="1200" height="520" rx="28" fill="#f7f1f2"/>
<text x="70" y="70" font-family="Montserrat,Arial,sans-serif" font-size="28" font-weight="800" fill="#0E0A0B">Compréhension de marque : les 4 piliers GEO</text>
<text x="70" y="105" font-family="Montserrat,Arial,sans-serif" font-size="16" fill="#6f6265">Plus les informations sont structurées et cohérentes, plus le contexte de la marque est lisible.</text>
<g font-family="Montserrat,Arial,sans-serif">
  <rect x="70" y="160" width="235" height="245" rx="22" fill="#fff" stroke="#eadcdf"/>
  <circle cx="187" cy="215" r="35" fill="#fde8ea"/><text x="187" y="225" text-anchor="middle" font-size="28" font-weight="800" fill="#a81b2e">01</text>
  <text x="95" y="275" font-size="21" font-weight="800" fill="#0E0A0B">Entité</text>
  <text x="95" y="307" font-size="14" fill="#6f6265">Qui êtes-vous ?</text>
  <text x="95" y="333" font-size="14" fill="#6f6265">Nom, activité, offre,</text><text x="95" y="354" font-size="14" fill="#6f6265">localisation, spécialités.</text>
  <rect x="330" y="160" width="235" height="245" rx="22" fill="#fff" stroke="#eadcdf"/>
  <circle cx="447" cy="215" r="35" fill="#fde8ea"/><text x="447" y="225" text-anchor="middle" font-size="28" font-weight="800" fill="#a81b2e">02</text>
  <text x="355" y="275" font-size="21" font-weight="800" fill="#0E0A0B">Expertise</text>
  <text x="355" y="307" font-size="14" fill="#6f6265">Que maîtrisez-vous ?</text>
  <text x="355" y="333" font-size="14" fill="#6f6265">Méthodes, cas d’usage,</text><text x="355" y="354" font-size="14" fill="#6f6265">preuves, auteurs, savoir-faire.</text>
  <rect x="590" y="160" width="235" height="245" rx="22" fill="#fff" stroke="#eadcdf"/>
  <circle cx="707" cy="215" r="35" fill="#fde8ea"/><text x="707" y="225" text-anchor="middle" font-size="28" font-weight="800" fill="#a81b2e">03</text>
  <text x="615" y="275" font-size="21" font-weight="800" fill="#0E0A0B">Cohérence</text>
  <text x="615" y="307" font-size="14" fill="#6f6265">Les sources racontent-elles</text><text x="615" y="328" font-size="14" fill="#6f6265">la même histoire ?</text>
  <text x="615" y="360" font-size="14" fill="#6f6265">Site, profils, annuaires,</text><text x="615" y="381" font-size="14" fill="#6f6265">réseaux et contenus.</text>
  <rect x="850" y="160" width="280" height="245" rx="22" fill="#0E0A0B"/>
  <circle cx="990" cy="215" r="35" fill="#d7263d"/><text x="990" y="225" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">04</text>
  <text x="875" y="275" font-size="21" font-weight="800" fill="#fff">Preuves</text>
  <text x="875" y="307" font-size="14" fill="#eadcdf">Pourquoi vous croire ?</text>
  <text x="875" y="333" font-size="14" fill="#eadcdf">Références, avis, données,</text><text x="875" y="354" font-size="14" fill="#eadcdf">partenariats et mentions.</text>
</g>
</svg>