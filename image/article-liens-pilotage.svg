<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Pilotage d'une stratégie de netlinking</title>
<desc id="d">Graphique conceptuel montrant la progression du pilotage par pertinence, diversité, qualité et suivi.</desc>
<rect width="1200" height="560" rx="28" fill="#f7f1f2"/>
<text x="70" y="66" font-family="Montserrat,Arial,sans-serif" font-size="28" font-weight="800" fill="#0E0A0B">Les bons indicateurs pour piloter les liens</text>
<text x="70" y="101" font-family="Montserrat,Arial,sans-serif" font-size="16" fill="#6f6265">Le volume seul ne permet pas d'évaluer la qualité d'une campagne de netlinking.</text>
<g font-family="Montserrat,Arial,sans-serif">
<line x1="120" y1="455" x2="1110" y2="455" stroke="#b9aaae" stroke-width="2"/>
<line x1="120" y1="155" x2="120" y2="455" stroke="#b9aaae" stroke-width="2"/>
<text x="67" y="165" font-size="12" fill="#6f6265">Valeur</text><text x="1055" y="490" font-size="12" fill="#6f6265">Maturité</text>
<path d="M170 410 C320 395, 385 360, 505 330 S720 250, 920 205 S1025 180, 1090 165" fill="none" stroke="#d7263d" stroke-width="6" stroke-linecap="round"/>
<g fill="#fff" stroke="#eadcdf" stroke-width="2">
<circle cx="230" cy="397" r="45"/><circle cx="470" cy="340" r="45"/><circle cx="710" cy="257" r="45"/><circle cx="950" cy="198" r="45"/>
</g>
<g fill="#a81b2e" font-size="16" font-weight="800" text-anchor="middle"><text x="230" y="393">Pertinence</text><text x="470" y="336">Diversité</text><text x="710" y="253">Qualité</text><text x="950" y="194">Suivi</text></g>
<g fill="#6f6265" font-size="12" text-anchor="middle"><text x="230" y="418">sujet ↔ page</text><text x="470" y="361">sources variées</text><text x="710" y="278">éditorial &amp; crédible</text><text x="950" y="219">gains &amp; ajustements</text></g>
<text x="150" y="445" font-size="12" fill="#6f6265">Stratégie opportuniste</text><text x="920" y="145" font-size="12" fill="#6f6265">Stratégie pilotée</text>
</g></svg>