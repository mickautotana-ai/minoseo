<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Les leviers de qualité en saisie de données</title>
<desc id="desc">Graphique conceptuel montrant l'impact de la documentation, du contrôle, de la formation et du suivi sur la fiabilité.</desc>
<rect width="1200" height="560" rx="28" fill="#f7f1f2"/>
<text x="70" y="68" font-family="Montserrat,Arial,sans-serif" font-size="28" font-weight="800" fill="#0E0A0B">Les leviers qui sécurisent une opération à volume</text>
<text x="70" y="102" font-family="Montserrat,Arial,sans-serif" font-size="16" fill="#6f6265">Un dispositif robuste combine standardisation, contrôle et amélioration continue.</text>
<g font-family="Montserrat,Arial,sans-serif">
<line x1="120" y1="455" x2="1110" y2="455" stroke="#b9aaae" stroke-width="2"/>
<line x1="120" y1="160" x2="120" y2="455" stroke="#b9aaae" stroke-width="2"/>
<text x="70" y="170" font-size="12" fill="#6f6265">Impact</text>
<text x="1070" y="492" font-size="12" fill="#6f6265">Maturité</text>
<g fill="#fde8ea"><rect x="180" y="350" width="150" height="105" rx="14"/><rect x="400" y="300" width="150" height="155" rx="14"/><rect x="620" y="235" width="150" height="220" rx="14"/><rect x="840" y="185" width="150" height="270" rx="14"/></g>
<g fill="#a81b2e" font-size="16" font-weight="800" text-anchor="middle"><text x="255" y="388">Formation</text><text x="475" y="338">Documentation</text><text x="695" y="273">Contrôle</text><text x="915" y="223">Pilotage</text></g>
<g fill="#6f6265" font-size="12" text-anchor="middle"><text x="255" y="414">règles partagées</text><text x="475" y="364">référentiel stable</text><text x="695" y="299">détection d'écarts</text><text x="915" y="249">KPIs &amp; amélioration</text></g>
<path d="M255 330 C390 315, 470 280, 545 265 S720 205, 915 150" fill="none" stroke="#d7263d" stroke-width="5" stroke-linecap="round"/>
<circle cx="255" cy="330" r="7" fill="#d7263d"/><circle cx="475" cy="280" r="7" fill="#d7263d"/><circle cx="695" cy="215" r="7" fill="#d7263d"/><circle cx="915" cy="150" r="7" fill="#d7263d"/>
</g></svg>