<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="t d">
<title id="t">Core Web Vitals sur mobile</title><desc id="d">Visualisation des trois indicateurs LCP, INP et CLS avec leurs seuils de bonne expérience.</desc>
<rect width="1100" height="500" rx="34" fill="#0E0A0B"/>
<text x="70" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Les 3 Core Web Vitals à surveiller</text>
<text x="70" y="112" font-family="Arial" font-size="16" fill="#D8C6C9">Objectif : rester dans la zone « bonne » pour la majorité des utilisateurs.</text>
<g font-family="Arial">
<rect x="70" y="165" width="290" height="250" rx="22" fill="#fff"/>
<text x="98" y="210" font-size="18" font-weight="700" fill="#241518">LCP</text><text x="98" y="247" font-size="40" font-weight="800" fill="#D7263D">≤ 2,5 s</text><text x="98" y="278" font-size="14" fill="#77666a">Chargement du contenu</text>
<rect x="98" y="320" width="234" height="14" rx="7" fill="#eee5e7"/><rect x="98" y="320" width="165" height="14" rx="7" fill="#D7263D"/>
<rect x="405" y="165" width="290" height="250" rx="22" fill="#fff"/>
<text x="433" y="210" font-size="18" font-weight="700" fill="#241518">INP</text><text x="433" y="247" font-size="40" font-weight="800" fill="#D7263D">≤ 200 ms</text><text x="433" y="278" font-size="14" fill="#77666a">Réactivité aux interactions</text>
<rect x="433" y="320" width="234" height="14" rx="7" fill="#eee5e7"/><rect x="433" y="320" width="190" height="14" rx="7" fill="#D7263D"/>
<rect x="740" y="165" width="290" height="250" rx="22" fill="#fff"/>
<text x="768" y="210" font-size="18" font-weight="700" fill="#241518">CLS</text><text x="768" y="247" font-size="40" font-weight="800" fill="#D7263D">≤ 0,1</text><text x="768" y="278" font-size="14" fill="#77666a">Stabilité visuelle</text>
<rect x="768" y="320" width="234" height="14" rx="7" fill="#eee5e7"/><rect x="768" y="320" width="145" height="14" rx="7" fill="#D7263D"/>
</g></svg>