<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="32" fill="#0E0A0B"/><text x="65" y="72" font-family="Arial" font-size="28" font-weight="700" fill="#fff">La lecture croisée transforme un chiffre en décision</text><g font-family="Arial"><rect x="65" y="130" width="285" height="280" rx="22" fill="#fff"/><text x="92" y="177" font-size="20" font-weight="700" fill="#241518">Impressions ↑</text><text x="92" y="215" font-size="16" fill="#77666a">+ CTR ↓</text><text x="92" y="274" font-size="15" fill="#241518">→ travailler le snippet,</text><text x="92" y="298" font-size="15" fill="#241518">l’intention et la SERP</text><rect x="408" y="130" width="285" height="280" rx="22" fill="#fff"/><text x="435" y="177" font-size="20" font-weight="700" fill="#241518">Trafic ↑</text><text x="435" y="215" font-size="16" fill="#77666a">+ conversions ↔</text><text x="435" y="274" font-size="15" fill="#241518">→ revoir l’offre, le CTA</text><text x="435" y="298" font-size="15" fill="#241518">et les pages d’arrivée</text><rect x="751" y="130" width="285" height="280" rx="22" fill="#fff"/><text x="778" y="177" font-size="20" font-weight="700" fill="#241518">Citations IA ↑</text><text x="778" y="215" font-size="16" fill="#77666a">+ referrals IA ↑</text><text x="778" y="274" font-size="15" fill="#241518">→ consolider les entités,</text><text x="778" y="298" font-size="15" fill="#241518">preuves et contenus</text></g></svg>